run:
  name: phase4_intelligent_refinement
  output_root: results/phase4
  prompts_path: prompts/benchmark_prompts.json
  prompt_limit: 4
  prompt_categories: []
  seeds: [42]
  images_per_prompt: 1
  width: 512
  height: 512
  inference_steps: 20
  guidance_scale: 7.5
  scheduler: DDIMScheduler
  device: cuda
  precision: float16
  smoke_mode: false
  allow_mock_fallback: false

models:
  - sd15

metrics:
  enable_clip_score: true
  enable_sharpness: false
  enable_fid: false

reporting:
  build_plots: true
  build_grids: true

feedback:
  mode: mock
  gemini_model: gemini-2.5-flash-lite
  iterations: 1
  critique_template: |
    Return strict JSON.

super_resolution:
  backend: pil
  fallback_backend: pil
  model_name: realesr-general-x4v3
  scale: 2
  tile: 0

refinement:
  n_candidates: 3
  critics:
    - composition
    - detail
    - style
  generate_negative: true
  gemini_mode: ollama
  gemini_model: gemma3:4b
